; INTERNAL - fork only, never in a PR to upstream.
; The .60 iGate (EA4GLO-12): W5100S-EVB-Pico2 on an older E22P carrier (no jumper)
; rewired by hand: DIO2-TXEN bridge cut and TXEN to GP28. DL20U9A GPS on UART1.
; Same 2 MB flash layout as before, so the LittleFS config survives the change.
[env:internal_60_w5100s]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0dcdd94eead72fdf56ea59a3d7c8aa2f379
board = wiznet_5100s_evb_pico2
board_build.core = earlephilhower
board_build.filesystem_size = 0.75m
board_build.embed_files =
board_build.partitions =
extra_scripts = pre:tools/gen_web_assets_rp2350.py
build_src_filter = -<*> +<rp2350/> +<configuration.cpp> +<kiss_utils.cpp> +<map_utils.cpp>
build_unflags =
	-Werror
debug_tool = cmsis-dap
build_flags =
	${common.build_flags}
	-I variants/wiznet_5100s_evb_pico2_e22p
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-D RADIOLIB_LOW_LEVEL=1
	-D WIZNET_5100S_EVB_PICO2_E22P
	-D USE_W5100S
	-I src/rp2350/compat_w5100s
	-D RADIO_TXEN=28
	-D HAS_GPS
	-D GPS_BAUDRATE=38400
lib_deps =
	https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip
	bblanchon/ArduinoJson @ 7.4.3
	jgromes/RadioLib @ 7.6.0
	knolleary/PubSubClient @ 2.8
	mikalhart/TinyGPSPlus @ 1.1.0
	richonguzman/APRSPacketLib @ 1.0.10
	adafruit/Adafruit Unified Sensor @ 1.1.15
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BME680 Library @ 2.0.6
