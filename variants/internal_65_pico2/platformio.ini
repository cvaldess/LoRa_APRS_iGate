; INTERNAL - fork only, never in a PR to upstream.
; The .65 iGate (EA4GLO-11): a Pico 2 carrier with GP16-19 damaged, so the W5500
; was moved to other pins (see board_pinout.h here), and TXEN rewired to GP28.
; Keeps the W5500-EVB-Pico2 board definition (2 MB layout) so its LittleFS config
; stays where it is; the Pico 2 definition (4 MB) would move it.
[env:internal_65_pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0dcdd94eead72fdf56ea59a3d7c8aa2f379
board = wiznet_5500_evb_pico2
board_build.core = earlephilhower
board_build.filesystem_size = 0.75m
board_build.embed_files =
board_build.partitions =
extra_scripts = pre:tools/gen_web_assets_rp2350.py
build_src_filter = -<*> +<rp2350/> +<configuration.cpp> +<kiss_utils.cpp> +<map_utils.cpp>
build_unflags =
	-Werror
debug_tool = cmsis-dap
build_flags =
	${common.build_flags}
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-D RADIOLIB_LOW_LEVEL=1
	-D PICO2_W5500_E22
lib_deps =
	arduino-libraries/Ethernet @ 2.0.2
	bblanchon/ArduinoJson @ 7.4.3
	jgromes/RadioLib @ 7.6.0
	knolleary/PubSubClient @ 2.8
	mikalhart/TinyGPSPlus @ 1.1.0
	richonguzman/APRSPacketLib @ 1.0.10
	adafruit/Adafruit Unified Sensor @ 1.1.15
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BME680 Library @ 2.0.6
